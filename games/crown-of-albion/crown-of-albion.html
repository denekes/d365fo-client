<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10131c">
<title>Crown of Albion — A Medieval Saga of Conquest</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0b0e15;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#game {
  display: block;
  touch-action: none;
  background: #10131c;
}

</style>
</head>
<body>
<canvas id="game" width="720" height="1280"></canvas>
<script>
'use strict';
/* =========================================================
   Crown of Albion — core engine
   canvas / loop / input / ui / audio / particles / modal
   ========================================================= */

const W = 720, H = 1280;
const TAU = Math.PI * 2;
let canvas, ctx, drawScale = 1;

/* ---------------- utils ---------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hexRGB(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function shade(hex, amt) {
  let [r, g, b] = hexRGB(hex);
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function mix(hexA, hexB, t) {
  const a = hexRGB(hexA), b = hexRGB(hexB);
  return `rgb(${lerp(a[0], b[0], t) | 0},${lerp(a[1], b[1], t) | 0},${lerp(a[2], b[2], t) | 0})`;
}

/* deterministic 2d value-noise (for map + textures) */
function vnHash(x, y) {
  const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return h - Math.floor(h);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = vnHash(xi, yi), b = vnHash(xi + 1, yi);
  const c = vnHash(xi, yi + 1), d = vnHash(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fnoise(x, y) { // 2 octaves
  return vnoise(x, y) * 0.66 + vnoise(x * 2.13 + 7.7, y * 2.13 + 3.1) * 0.34;
}

/* ---------------- text ---------------- */
const FONT = 'Georgia, "Times New Roman", serif';
function text(s, x, y, size, color = '#f0e6d2', align = 'center', bold = false, alpha = 1) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
  ctx.restore();
}
function textShadow(s, x, y, size, color = '#f0e6d2', align = 'center', bold = true) {
  text(s, x + 2, y + 3, size, 'rgba(0,0,0,0.55)', align, bold);
  text(s, x, y, size, color, align, bold);
}
function wrapLines(s, size, maxW) {
  ctx.font = `${size}px ${FONT}`;
  const words = String(s).split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

/* ---------------- ui: buttons & panels ---------------- */
function makeBtn(x, y, w, h, label, fn, opts = {}) {
  return Object.assign({ x, y, w, h, label, fn, enabled: true, size: 26, color: '#5a3d22' }, opts);
}
function drawBtn(b) {
  ctx.save();
  ctx.globalAlpha *= b.enabled ? 1 : 0.4;
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  g.addColorStop(0, shade(b.color, 0.25));
  g.addColorStop(0.5, b.color);
  g.addColorStop(1, shade(b.color, -0.35));
  roundRect(b.x, b.y, b.w, b.h, 12);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#c9a44a';
  ctx.stroke();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,235,180,0.35)';
  roundRect(b.x + 3, b.y + 3, b.w - 6, b.h - 6, 9);
  ctx.stroke();
  textShadow(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1, b.size, '#f5e9c8');
  ctx.restore();
}
function btnAt(list, x, y) {
  for (const b of list) {
    if (b.enabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function panel(x, y, w, h, opts = {}) {
  ctx.save();
  roundRect(x, y, w, h, opts.r || 18);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, opts.top || '#3a2c1c');
  g.addColorStop(1, opts.bot || '#241a10');
  ctx.fillStyle = g;
  ctx.globalAlpha *= (opts.alpha === undefined ? 0.96 : opts.alpha);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#c9a44a';
  ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(255,235,180,0.25)';
  roundRect(x + 5, y + 5, w - 10, h - 10, (opts.r || 18) - 6);
  ctx.stroke();
  ctx.restore();
}

/* small icons drawn in vector */
function drawCoin(x, y, r = 11) {
  ctx.save();
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
  g.addColorStop(0, '#ffe9a0'); g.addColorStop(0.7, '#e2b53e'); g.addColorStop(1, '#8a6418');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#6e4d10'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = 'rgba(110,77,16,0.7)';
  ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, TAU); ctx.stroke();
  ctx.restore();
}
function drawStar(x, y, r, color = '#ffd75e') {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.45 : r;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}
function drawCrown(x, y, s, color = '#e8bd4a') {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.strokeStyle = shade('#e8bd4a', -0.5);
  ctx.lineWidth = 0.12;
  ctx.beginPath();
  ctx.moveTo(-1, 0.55); ctx.lineTo(-1.15, -0.45); ctx.lineTo(-0.55, 0.05);
  ctx.lineTo(0, -0.75); ctx.lineTo(0.55, 0.05); ctx.lineTo(1.15, -0.45);
  ctx.lineTo(1, 0.55); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillRect(-1, 0.55, 2, 0.3);
  ctx.fillStyle = '#c33a4b';
  ctx.beginPath(); ctx.arc(0, 0.7, 0.13, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2c6fb3';
  ctx.beginPath(); ctx.arc(-0.6, 0.7, 0.1, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0.6, 0.7, 0.1, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawSword(x, y, s, ang = -Math.PI / 4) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  ctx.fillStyle = '#cdd4dc';
  ctx.beginPath();
  ctx.moveTo(0, -1.1); ctx.lineTo(0.1, -0.95); ctx.lineTo(0.1, 0.25);
  ctx.lineTo(-0.1, 0.25); ctx.lineTo(-0.1, -0.95); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#a9842f';
  ctx.fillRect(-0.3, 0.25, 0.6, 0.12);
  ctx.fillStyle = '#6b4a22';
  ctx.fillRect(-0.07, 0.37, 0.14, 0.4);
  ctx.fillStyle = '#a9842f';
  ctx.beginPath(); ctx.arc(0, 0.85, 0.11, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawCastleIcon(x, y, s, color = '#cfc6b4') {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(40,30,20,0.6)';
  ctx.lineWidth = 0.08;
  ctx.fillRect(-1, -0.3, 2, 1.1);
  ctx.strokeRect(-1, -0.3, 2, 1.1);
  for (let i = -1; i <= 1; i++) ctx.fillRect(i * 0.7 - 0.18, -0.62, 0.36, 0.36);
  ctx.fillRect(-1.35, -0.9, 0.5, 1.7);
  ctx.fillRect(0.85, -0.9, 0.5, 1.7);
  ctx.strokeRect(-1.35, -0.9, 0.5, 1.7);
  ctx.strokeRect(0.85, -0.9, 0.5, 1.7);
  ctx.fillStyle = '#4a3826';
  ctx.beginPath();
  ctx.moveTo(-0.25, 0.8); ctx.lineTo(-0.25, 0.25);
  ctx.arc(0, 0.25, 0.25, Math.PI, 0);
  ctx.lineTo(0.25, 0.8); ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawHelmIcon(x, y, s, color = '#b9c2cc') {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-0.7, 0.8); ctx.lineTo(-0.7, -0.1);
  ctx.arc(0, -0.1, 0.7, Math.PI, 0);
  ctx.lineTo(0.7, 0.8); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#1c2026';
  ctx.fillRect(-0.7, 0.05, 1.4, 0.18);
  ctx.fillStyle = shade('#b9c2cc', -0.3);
  ctx.fillRect(-0.08, -0.85, 0.16, 0.3);
  ctx.restore();
}

/* ---------------- input ---------------- */
const Input = {
  x: 0, y: 0, down: false,
  downX: 0, downY: 0, downT: 0,
};
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
function bindInput() {
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    Sfx.ensure();
    const [x, y] = toLogical(e);
    Input.x = x; Input.y = y; Input.down = true;
    Input.downX = x; Input.downY = y; Input.downT = performance.now();
    dispatch('down', x, y);
  });
  canvas.addEventListener('pointermove', e => {
    const [x, y] = toLogical(e);
    Input.x = x; Input.y = y;
    if (Input.down) dispatch('move', x, y);
  });
  const up = e => {
    if (!Input.down) return;
    const [x, y] = toLogical(e);
    Input.x = x; Input.y = y; Input.down = false;
    dispatch('up', x, y);
    const dt = performance.now() - Input.downT;
    if (dt < 450 && dist(x, y, Input.downX, Input.downY) < 24) dispatch('tap', x, y);
    else {
      const dx = x - Input.downX, dy = y - Input.downY;
      if (Math.hypot(dx, dy) > 50 && dt < 700) {
        dispatch('swipe', Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      }
    }
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
}
function dispatch(kind, a, b) {
  if (Modal.active) { if (kind === 'tap') Modal.tap(a, b); return; }
  const s = scene;
  if (!s) return;
  const fn = { down: s.onDown, move: s.onMove, up: s.onUp, tap: s.onTap, swipe: s.onSwipe }[kind];
  if (fn) fn.call(s, a, b);
}
function buzz(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* unsupported */ }
}

/* ---------------- audio (procedural, multi-voice) ---------------- */
const Sfx = {
  ac: null, master: null, wet: null, on: true, musicOn: true,
  nextBar: 0, barI: 0,
  /* an 8-bar majestic progression in A minor: Am G F Am | Dm C E Am
     each bar: bass root, a sustained triad pad, and a stately lead line */
  prog: [
    { root: 45, chord: [57, 60, 64], mel: [[76, 2], [72, 2]] },
    { root: 43, chord: [55, 59, 62], mel: [[74, 2], [71, 2]] },
    { root: 41, chord: [53, 57, 60], mel: [[72, 2], [69, 2]] },
    { root: 45, chord: [57, 60, 64], mel: [[69, 1], [72, 1], [76, 2]] },
    { root: 38, chord: [50, 53, 57], mel: [[74, 2], [69, 2]] },
    { root: 36, chord: [48, 52, 55], mel: [[72, 2], [67, 2]] },
    { root: 40, chord: [52, 56, 59], mel: [[71, 2], [68, 2]] },
    { root: 45, chord: [57, 60, 64], mel: [[69, 3], [71, 1]] },
  ],
  ensure() {
    if (!this.ac) {
      try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      const ac = this.ac;
      this.master = ac.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(ac.destination);
      // a generated hall reverb for cinematic space
      try {
        const len = Math.floor(ac.sampleRate * 2.2);
        const imp = ac.createBuffer(2, len, ac.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = imp.getChannelData(ch);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
        }
        this.conv = ac.createConvolver(); this.conv.buffer = imp;
        this.wet = ac.createGain(); this.wet.gain.value = 0.22;
        this.master.connect(this.conv); this.conv.connect(this.wet); this.wet.connect(ac.destination);
      } catch (e) { /* no reverb */ }
      this.nextBar = ac.currentTime + 0.35;
    }
    if (this.ac.state === 'suspended') this.ac.resume();
  },
  freq(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  /* one shaped voice with ADSR, routed through master (so it gets reverb) */
  voice(f, dur, { type = 'triangle', vol = 0.1, slide = 0, delay = 0, attack = 0.012, detune = 0 } = {}) {
    if (!this.ac || !this.on || !this.master) return;
    const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (detune) o.detune.setValueAtTime(detune, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g).connect(this.master);
    o.start(t); o.stop(t + dur + 0.06);
  },
  tone(f, dur, opts = {}) { this.voice(f, dur, Object.assign({ type: 'square', vol: 0.12 }, opts)); },
  noise(dur, vol = 0.2, delay = 0, low = false) {
    if (!this.ac || !this.on || !this.master) return;
    const t = this.ac.currentTime + delay;
    const n = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    let v = 0;
    for (let i = 0; i < n; i++) {
      const wh = Math.random() * 2 - 1;
      v = low ? v * 0.92 + wh * 0.08 : wh;
      d[i] = v * (1 - i / n);
    }
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const g = this.ac.createGain(); g.gain.value = vol;
    src.connect(g).connect(this.master);
    src.start(t);
  },
  // a soft timpani/war-drum
  kick(delay, strong) {
    this.voice(strong ? 96 : 84, 0.2, { type: 'sine', vol: strong ? 0.16 : 0.09, slide: -56, delay, attack: 0.005 });
    this.noise(0.12, strong ? 0.05 : 0.03, delay, true);
  },
  tap() { this.voice(660, 0.06, { type: 'triangle', vol: 0.07 }); },
  coin() { this.voice(880, 0.07, { type: 'square', vol: 0.06 }); this.voice(1320, 0.12, { type: 'square', vol: 0.06, delay: 0.07 }); },
  clash() { this.noise(0.16, 0.22); this.voice(220, 0.12, { type: 'sawtooth', vol: 0.09, slide: -120 }); },
  thud() { this.noise(0.3, 0.28, 0, true); this.voice(70, 0.25, { type: 'sine', vol: 0.22, slide: -30 }); },
  crack() { this.noise(0.4, 0.32, 0, true); this.noise(0.15, 0.28); },
  whoosh() { this.noise(0.25, 0.09, 0, true); },
  fanfare() {
    // brass-like triad rising to the octave — voiced in thirds for majesty
    const seq = [[64, 0], [64, 0.13], [64, 0.26], [67, 0.42], [72, 0.62], [76, 0.86]];
    for (const [m, d] of seq) {
      this.voice(this.freq(m), 0.4, { type: 'sawtooth', vol: 0.05, delay: d, attack: 0.02 });
      this.voice(this.freq(m), 0.4, { type: 'square', vol: 0.035, delay: d, detune: 6 });
      this.voice(this.freq(m - 12), 0.4, { type: 'triangle', vol: 0.06, delay: d });
    }
    this.kick(0, true); this.kick(0.42, true); this.kick(0.86, true);
  },
  dirge() {
    const seq = [[57, 0], [55, 0.45], [53, 0.9], [52, 1.4]];
    for (const [m, d] of seq) {
      this.voice(this.freq(m), 0.6, { type: 'triangle', vol: 0.09, delay: d, attack: 0.04 });
      this.voice(this.freq(m - 12), 0.7, { type: 'sine', vol: 0.06, delay: d });
    }
    this.kick(0, false); this.kick(0.9, false);
  },
  update() {
    if (!this.ac || !this.on || !this.musicOn || !this.master) return;
    const beat = 0.5, bar = beat * 4;
    while (this.nextBar < this.ac.currentTime + 0.7) {
      const delay = Math.max(0, this.nextBar - this.ac.currentTime);
      const b = this.prog[this.barI % this.prog.length];
      // bass: root then the fifth, low and round
      this.voice(this.freq(b.root - 12), beat * 1.9, { type: 'sine', vol: 0.08, attack: 0.02, delay });
      this.voice(this.freq(b.root - 12), beat * 1.9, { type: 'triangle', vol: 0.025, delay });
      this.voice(this.freq(b.root - 5), beat * 1.9, { type: 'sine', vol: 0.07, attack: 0.02, delay: delay + beat * 2 });
      // sustained chord pad
      for (const m of b.chord) {
        this.voice(this.freq(m), bar * 0.97, { type: 'triangle', vol: 0.02, attack: 0.18, delay });
        this.voice(this.freq(m + 12), bar * 0.97, { type: 'sine', vol: 0.012, attack: 0.22, delay });
      }
      // stately lead, doubled an octave down very softly (recorder + lute)
      let mt = delay;
      for (const [m, beats] of b.mel) {
        const d2 = beats * beat * 0.92;
        this.voice(this.freq(m), d2, { type: 'triangle', vol: 0.05, attack: 0.02, delay: mt });
        this.voice(this.freq(m), d2, { type: 'square', vol: 0.016, attack: 0.02, delay: mt, detune: 5 });
        this.voice(this.freq(m - 12), d2, { type: 'sine', vol: 0.02, delay: mt });
        mt += beats * beat;
      }
      // war-drum on the strong beats
      this.kick(delay, true);
      this.kick(delay + beat * 2, false);
      this.nextBar += bar;
      this.barI++;
    }
  },
};

/* ---------------- particles ---------------- */
const parts = [];
function spawn(x, y, o = {}) {
  parts.push({
    x, y,
    vx: o.vx !== undefined ? o.vx : rnd(-60, 60),
    vy: o.vy !== undefined ? o.vy : rnd(-90, -20),
    g: o.g !== undefined ? o.g : 220,
    life: o.life || rnd(0.4, 0.9),
    t: 0,
    size: o.size || rnd(2, 5),
    color: o.color || '#caa',
    shrink: o.shrink !== undefined ? o.shrink : true,
  });
}
function burst(x, y, n, o = {}) {
  for (let i = 0; i < n; i++) {

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }

/* ---------------- modal ---------------- */
const Modal = {
  active: null,
  show(o) {

    o.w = o.w || 560;

  close() { this.active = null; },
  layout(o) {

  },
  render(dt) {
    const o = this.active;
    if (!o) return;
    o.t += dt;
    const k = easeOut(clamp(o.t / 0.18, 0, 1));
    ctx.fillStyle = `rgba(5,5,10,${0.6 * k})`;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(k, k);
    ctx.translate(-W / 2, -H / 2);
    const { wrapped, h, x, y } = this.layout(o);
    panel(x, y, o.w, h);
    let cy = y + 56;
    if (o.icon) { o.icon(W / 2, cy + 10); cy += 60; }
    textShadow(o.title, W / 2, cy, 34, '#ffd75e');
    cy += 50;
    for (const ln of wrapped) { text(ln, W / 2, cy, 26, '#ead9b8'); cy += 34; }
    cy += 10;
    o._btns = [];
    for (const b of o.buttons) {
      const bb = makeBtn(x + 40, cy, o.w - 80, 60, b.label, b.fn, { color: b.color || '#5a3d22' });
      o._btns.push(bb);
      drawBtn(bb);
      cy += 74;
    }
    ctx.restore();
  },
  tap(x, y) {
    const o = this.active;
    if (!o || !o._btns) return;
    const b = btnAt(o._btns, x, y);

      this.close();

/* ---------------- scene & loop ---------------- */
let scene = null, gTime = 0, shake = 0;
let timeScale = 1, slowMoT = 0;
function slowMo(scale, dur) { timeScale = scale; slowMoT = dur; }
function setScene(s, ...args) {
  if (scene && scene.exit) scene.exit();
  scene = s;
  if (s.enter) s.enter(...args);
}
let lastTs = 0;
function frame(ts) {
  const rawDt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  if (slowMoT > 0) { slowMoT -= rawDt; if (slowMoT <= 0) timeScale = 1; }
  const dt = rawDt * timeScale;
  gTime += dt;
  Sfx.update();
  if (scene && scene.update) scene.update(dt);
  ctx.setTransform(drawScale, 0, 0, drawScale, 0, 0);
  ctx.save();
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 30);
    ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  }
  ctx.fillStyle = '#10131c';
  ctx.fillRect(-20, -20, W + 40, H + 40);
  if (scene && scene.render) scene.render(dt);
  updParts(dt);
  drawParts();
  ctx.restore();

}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
  canvas.width = Math.max(1, Math.round(W * s * dpr));
  canvas.height = Math.max(1, Math.round(H * s * dpr));
  drawScale = canvas.width / W;
}

/* ---------------- cinematic helpers ---------------- */
function vignette(strength = 0.4) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.74);
  g.addColorStop(0, 'rgba(0,0,0,0)');

  ctx.fillRect(0, 0, W, H);
}
function letterbox(k) {

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, 92 * k);
  ctx.fillRect(0, H - 92 * k, W, 92 * k);
}
function sunRays(x, y, r, color, alpha, n = 10, speed = 0.05) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(gTime * speed);
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    ctx.rotate(TAU / n);
    ctx.globalAlpha = alpha * (0.55 + 0.45 * Math.sin(gTime * 0.8 + i * 1.7));
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(r, -r * 0.055);
    ctx.lineTo(r, r * 0.055);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}
function glow(x, y, r, color, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.restore();
}

function initEngine() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  window.addEventListener('resize', resize);
  resize();
  bindInput();
}

<script>
'use strict';
/* =========================================================
   Crown of Albion — world
   the isle of Britain / game state / economy / combat / AI
   ========================================================= */

const MAPY = 120, MAPH = 1000;          // map strip inside the screen
const HALFW = 360, HALFH = 500;         // half-resolution raster for territories

/* A simplified tracing of the Great Britain coastline (half-res coords,
   x right, y down). North tip first, down the east coast, back up the west. */
const BRITAIN = [
  [215, 25], [245, 38], [262, 60], [235, 80], [268, 98], [258, 122],
  [242, 132], [272, 148], [285, 178], [295, 215], [288, 228], [312, 245],
  [305, 278], [332, 295], [330, 322], [305, 348], [302, 362], [295, 378],
  [262, 392], [225, 398], [185, 396], [148, 388], [98, 396], [58, 384],
  [85, 368], [122, 345], [152, 322], [128, 330], [92, 318], [72, 306],
  [98, 290], [92, 262], [108, 250], [138, 238], [158, 242], [162, 215],
  [152, 192], [168, 172], [148, 158], [162, 138], [142, 118], [168, 98],
  [148, 72], [172, 52], [190, 38],
];

function inPoly(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) {
      inside = !inside;
    }
  }
  return inside;
}

/* The twelve provinces — historical regions of the isle. */
const TERR_DEFS = [
  { name: 'The Highlands', sx: 210, sy: 66,  terrain: 'mount' },
  { name: 'Argyll',        sx: 184, sy: 114, terrain: 'mount' },
  { name: 'Lothian',       sx: 230, sy: 150, terrain: 'plain' },
  { name: 'Northumbria',   sx: 256, sy: 188, terrain: 'moor' },
  { name: 'Cumbria',       sx: 184, sy: 206, terrain: 'mount' },
  { name: 'York',          sx: 252, sy: 248, terrain: 'plain' },
  { name: 'Gwynedd',       sx: 120, sy: 272, terrain: 'mount' },
  { name: 'Mercia',        sx: 214, sy: 300, terrain: 'forest' },
  { name: 'East Anglia',   sx: 298, sy: 318, terrain: 'plain' },
  { name: 'Wessex',        sx: 204, sy: 362, terrain: 'plain' },
  { name: 'Kent',          sx: 276, sy: 366, terrain: 'plain' },
  { name: 'Cornwall',      sx: 100, sy: 372, terrain: 'moor' },
  { name: 'Sherwood Forest', sx: 243, sy: 280, terrain: 'forest', sherwood: true },
];

const SHERWOOD = TERR_DEFS.findIndex(t => t.sherwood);

const HOME_TERRS = [9, 2, 8, 6];  // player Wessex; rivals Lothian, East Anglia, Gwynedd

const HEROES = [
  { name: 'Sir Aldric the Bold',  joust: 8, blade: 5, lead: 5, blurb: 'A tournament legend. None ride the tilt so true.' },
  { name: 'Lady Maren of Wessex', joust: 5, blade: 8, lead: 5, blurb: 'A duelist without equal, quick as winter wind.' },
  { name: 'Sir Corwin the Wise',  joust: 5, blade: 5, lead: 8, blurb: 'A master of war. Soldiers fight twice as hard under his banner.' },
];

const AI_LORDS = [
  { name: 'Lord Bran the Black',  color: '#34548f', joust: 7, blade: 6, lead: 6 },
  { name: 'Duke Osric of Anglia', color: '#3e7c3a', joust: 6, blade: 7, lead: 5 },
  { name: 'Baron Hadwin the Grim', color: '#6b4a9e', joust: 5, blade: 5, lead: 8 },
];

const PLAYER_COLOR = '#b3372c';
const NEUTRAL_COLOR = '#9a8a64';

const COSTS = { soldier: 8, knight: 25, catapult: 50, garrison: 30, castle: 120 };
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December'];

const DIFFS = [
  { name: 'Squire', aiGold: 0.7, aiAggro: 1.7 },
  { name: 'Knight', aiGold: 1.0, aiAggro: 1.45 },
  { name: 'King',   aiGold: 1.35, aiAggro: 1.25 },
];

let S = null; // live game state

/* ---------------- biomes (area-dependent land colour) ---------------- */
const BIOME = {
  plain:    ['#4f7d33', '#6fa043', '#93c062'],   // valley → meadow → bright field
  forest:   ['#244a20', '#356128', '#4d8038'],   // deep wood → canopy → glade
  moor:     ['#5c6a3a', '#867b48', '#a08a62'],   // boggy green → ochre heath → tan
  mount:    ['#4c6a36', '#7d7656', '#b6b3a6'],   // green lower slope → rock → bare crag
  sherwood: ['#1d4520', '#2c6630', '#3f7e3c'],   // the deep greenwood
};
function ramp(stops, e) {
  const n = stops.length - 1;
  const f = clamp(e, 0, 1) * n;
  const i = Math.min(n - 1, Math.floor(f));
  const tt = f - i;
  const a = hexRGB(stops[i]), b = hexRGB(stops[i + 1]);
  return [lerp(a[0], b[0], tt), lerp(a[1], b[1], tt), lerp(a[2], b[2], tt)];
}
function biomeColor(terrain, e, x, y) {
  const c = ramp(BIOME[terrain] || BIOME.plain, e);
  if (terrain === 'mount' && e > 0.8) {            // snow on the high crags
    const s = (e - 0.8) / 0.2, sn = hexRGB('#e4ebee');
    c[0] = lerp(c[0], sn[0], s); c[1] = lerp(c[1], sn[1], s); c[2] = lerp(c[2], sn[2], s);
  } else if (terrain === 'moor') {                 // blooming heather
    const h = fnoise(x * 0.24 + 5, y * 0.24 + 9);
    if (h > 0.6) { const hp = hexRGB('#7a4f72'), s = (h - 0.6) / 0.4 * 0.55; c[0] = lerp(c[0], hp[0], s); c[1] = lerp(c[1], hp[1], s); c[2] = lerp(c[2], hp[2], s); }
  } else if (terrain === 'plain') {                // patchwork of fields
    const fld = (fnoise(x * 0.13 + 2, y * 0.13 + 8) - 0.5) * 30;
    c[0] += fld; c[1] += fld * 1.15; c[2] += fld * 0.35;
  } else if (terrain === 'forest' || terrain === 'sherwood') {
    const dap = (fnoise(x * 0.2 + 3, y * 0.2 + 1) - 0.5) * 22;
    c[0] += dap * 0.6; c[1] += dap; c[2] += dap * 0.5;
  }

/* ---------------- map generation (deterministic) ---------------- */
const MapGen = {
  idx: null,            // Int8Array, HALFW*HALFH, territory id or -1 = sea
  area: [], cx: [], cy: [], adj: [],
  halfCanvas: null, landCanvas: null, grainCanvas: null, foamCanvas: null, shadowCanvas: null,

  inIsland(x, y) {
    // wobble the sample point so the coast reads hand-drawn, not vectory
    const jx = x + (fnoise(x * 0.06 + 3.7, y * 0.06 + 9.2) - 0.5) * 9;
    const jy = y + (fnoise(x * 0.06 + 17.3, y * 0.06 + 4.9) - 0.5) * 9;
    return inPoly(jx, jy, BRITAIN);
  },

  build() {
    const n = TERR_DEFS.length;
    this.idx = new Int8Array(HALFW * HALFH).fill(-1);
    this.area = new Array(n).fill(0);
    this.cx = new Array(n).fill(0);
    this.cy = new Array(n).fill(0);
    this.adj = Array.from({ length: n }, () => new Set());

    for (let y = 0; y < HALFH; y++) {
      for (let x = 0; x < HALFW; x++) {
        let island = this.inIsland(x, y);
        let best = -1, bestD = 1e9;
        for (let i = 0; i < n; i++) {
          const t = TERR_DEFS[i];
          const d = dist(x, y, t.sx, t.sy);
          if (d < 11) island = true; // make sure every seed sits on land
          const jit = 1 + 0.55 * (fnoise(x * 0.05 + i * 41.3, y * 0.05 + i * 17.7) - 0.5);
          const jd = d * jit;
          if (jd < bestD) { bestD = jd; best = i; }

        if (!island) continue;
        this.idx[y * HALFW + x] = best;
        this.area[best]++;
        this.cx[best] += x;
        this.cy[best] += y;
      }
    }
    for (let i = 0; i < n; i++) {
      if (this.area[i] > 0) { this.cx[i] /= this.area[i]; this.cy[i] /= this.area[i]; }
      else { this.cx[i] = TERR_DEFS[i].sx; this.cy[i] = TERR_DEFS[i].sy; }
    }
    // adjacency from the raster
    for (let y = 0; y < HALFH - 1; y++) {
      for (let x = 0; x < HALFW - 1; x++) {
        const a = this.idx[y * HALFW + x];
        if (a < 0) continue;
        const r = this.idx[y * HALFW + x + 1];
        const d = this.idx[(y + 1) * HALFW + x];
        if (r >= 0 && r !== a) { this.adj[a].add(r); this.adj[r].add(a); }
        if (d >= 0 && d !== a) { this.adj[a].add(d); this.adj[d].add(a); }
      }
    }
    this.halfCanvas = document.createElement('canvas');
    this.halfCanvas.width = HALFW;
    this.halfCanvas.height = HALFH;
    this.landCanvas = document.createElement('canvas');
    this.landCanvas.width = W;
    this.landCanvas.height = MAPH;
    this.makeGrain();
    this.makeFoam();
    this.makeShadow();
    this.repaint();
  },

  /* a soft dark silhouette of the island, cast onto the sea to make the
     landmass read as raised relief floating above the water */
  makeShadow() {
    const half = document.createElement('canvas');
    half.width = HALFW; half.height = HALFH;
    const hc = half.getContext('2d');
    const img = hc.createImageData(HALFW, HALFH);
    const d = img.data;
    for (let i = 0; i < this.idx.length; i++) {
      if (this.idx[i] >= 0) { d[i * 4] = 6; d[i * 4 + 1] = 9; d[i * 4 + 2] = 16; d[i * 4 + 3] = 255; }
    }
    hc.putImageData(img, 0, 0);
    this.shadowCanvas = document.createElement('canvas');
    this.shadowCanvas.width = W; this.shadowCanvas.height = MAPH;
    const sc = this.shadowCanvas.getContext('2d');
    sc.imageSmoothingEnabled = true;
    sc.globalAlpha = 0.34;
    for (const [ox, oy] of [[0, 0], [3, 3], [-2, 2], [5, 5], [-4, 3]]) sc.drawImage(half, ox, oy, W, MAPH);
  },

  makeGrain() {
    this.grainCanvas = document.createElement('canvas');
    this.grainCanvas.width = W;
    this.grainCanvas.height = MAPH;
    const c = this.grainCanvas.getContext('2d');
    const img = c.createImageData(W, MAPH);
    for (let y = 0; y < MAPH; y += 2) {
      for (let x = 0; x < W; x += 2) {
        const v = (fnoise(x * 0.05, y * 0.05) - 0.5) * 36;
        for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
          const o = ((y + dy) * W + x + dx) * 4;
          img.data[o] = 128 + v; img.data[o + 1] = 128 + v; img.data[o + 2] = 128 + v;
          img.data[o + 3] = 26;
        }
      }
    }
    c.putImageData(img, 0, 0);
  },

  /* soft white surf hugging the coastline, blended over the sea each frame */
  makeFoam() {
    const half = document.createElement('canvas');
    half.width = HALFW;
    half.height = HALFH;
    const hc = half.getContext('2d');
    const img = hc.createImageData(HALFW, HALFH);
    for (let y = 1; y < HALFH - 1; y++) {
      for (let x = 1; x < HALFW - 1; x++) {
        if (this.idx[y * HALFW + x] >= 0) continue;
        let nearLand = 0;
        for (let r = 1; r <= 3; r++) {
          if (this.idx[y * HALFW + x + r] >= 0 || this.idx[y * HALFW + x - r] >= 0 ||
              this.idx[(y + r) * HALFW + x] >= 0 || this.idx[(y - r) * HALFW + x] >= 0) {
            nearLand = 4 - r;
            break;
          }
        }
        if (!nearLand) continue;
        const o = (y * HALFW + x) * 4;
        img.data[o] = 225; img.data[o + 1] = 240; img.data[o + 2] = 250;
        img.data[o + 3] = 50 + nearLand * 38;
      }
    }
    hc.putImageData(img, 0, 0);
    this.foamCanvas = document.createElement('canvas');
    this.foamCanvas.width = W;
    this.foamCanvas.height = MAPH;
    const fc = this.foamCanvas.getContext('2d');
    fc.imageSmoothingEnabled = true;
    fc.globalAlpha = 0.6;
    for (const [ox, oy] of [[0, 0], [1.5, 1], [-1.5, -1]]) {
      fc.drawImage(half, ox, oy, W, MAPH);
    }
  },

  ownerColor(i) {
    if (!S) return NEUTRAL_COLOR;
    const o = S.terr[i].owner;
    return o < 0 ? NEUTRAL_COLOR : S.lords[o].color;
  },

  repaint() {
    const hc = this.halfCanvas.getContext('2d');
    const img = hc.createImageData(HALFW, HALFH);
    const d = img.data;
    // owner colour per province (a light heraldic glaze over the green land)
    const ownerCol = TERR_DEFS.map((def, i) => {
      if (def.sherwood) return null;
      const ow = S ? S.terr[i].owner : -1;
      return ow < 0 ? null : hexRGB(S.lords[ow].color);
    });
    for (let y = 0; y < HALFH; y++) {
      for (let x = 0; x < HALFW; x++) {
        const o = (y * HALFW + x);
        const t = this.idx[o];
        if (t < 0) { d[o * 4 + 3] = 0; continue; }
        const def = TERR_DEFS[t];
        const terrain = def.sherwood ? 'sherwood' : def.terrain;
        // elevation field — mountains reach higher (snow), lowlands stay lush
        let elev = fnoise(x * 0.05 + t * 2.3, y * 0.05 + t * 1.1);
        if (terrain === 'mount') elev = clamp(elev * 1.45, 0, 1);
        let [r, g, b] = biomeColor(terrain, elev, x, y);
        // a soft wash of the owning lord's colour so holdings still read
        const oc = ownerCol[t];
        if (oc) { const k = 0.24; r = r * (1 - k) + oc[0] * k; g = g * (1 - k) + oc[1] * k; b = b * (1 - k) + oc[2] * k; }
        // border / coast shading — bold hand-inked outlines between provinces
        let border = false, coast = false;
        for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1],
                                [x + 1, y + 1], [x - 1, y - 1]]) {
          if (nx < 0 || ny < 0 || nx >= HALFW || ny >= HALFH) { coast = true; continue; }
          const nv = this.idx[ny * HALFW + nx];
          if (nv < 0) coast = true;
          else if (nv !== t) border = true;
        }
        // embossed relief, exaggerated in the hills
        const mFac = terrain === 'mount' ? 2.8 : terrain === 'moor' ? 1.4 : 1;
        const e1 = fnoise(x * 0.035 + 11, y * 0.035 + 5);
        const e2 = fnoise((x + 1.6) * 0.035 + 11, (y + 1.6) * 0.035 + 5);
        const relief = (e1 - e2) * 150 * mFac;
        // warm low sun from the south-west
        const warmth = (y / HALFH - 0.45) * 14;
        const sh = (fnoise(x * 0.09, y * 0.09) - 0.5) * 16 + relief;
        r += sh + warmth; g += sh + warmth * 0.5; b += sh - warmth * 0.5;
        if (coast) { r *= 0.42; g *= 0.42; b *= 0.42; }
        else if (border) { r = r * 0.24 + 12; g = g * 0.24 + 12; b = b * 0.24 + 9; }
        d[o * 4] = clamp(r, 0, 255);
        d[o * 4 + 1] = clamp(g, 0, 255);
        d[o * 4 + 2] = clamp(b, 0, 255);
        d[o * 4 + 3] = 255;
      }
    }
    hc.putImageData(img, 0, 0);
    const lc = this.landCanvas.getContext('2d');
    lc.clearRect(0, 0, W, MAPH);
    lc.imageSmoothingEnabled = true;
    lc.drawImage(this.halfCanvas, 0, 0, W, MAPH);
    lc.drawImage(this.grainCanvas, 0, 0);
    this.decorate(lc);
  },

  /* hand-inked terrain icons, medieval-chart style */
  decorate(lc) {
    const ink = 'rgba(58,40,24,0.6)';
    for (let i = 0; i < TERR_DEFS.length; i++) {
      const def = TERR_DEFS[i];
      if (def.terrain === 'plain') continue;
      const rng = mulberry32(i * 977 + 13);
      const cx = this.cx[i] * 2, cy = this.cy[i] * 2;
      const treeInk = def.sherwood ? 'rgba(18,54,26,0.9)' : ink;
      const goal = def.sherwood ? 11 : 5;
      let placed = 0, tries = 0;
      while (placed < goal && tries++ < 60) {
        const a = rng() * TAU, rr = (def.sherwood ? 18 : 34) + rng() * (def.sherwood ? 78 : 64);
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * 0.8;
        if (this.terrAt(x, y + MAPY) !== i) continue;
        if (Math.abs(x - cx) < 50 && y < cy + 4 && y > cy - 58) continue; // keep the banner clear
        lc.save();
        lc.translate(x, y);
        lc.strokeStyle = treeInk;
        lc.fillStyle = treeInk;
        lc.lineWidth = 2;
        if (def.terrain === 'mount') {
          lc.beginPath();
          lc.moveTo(-12, 6); lc.lineTo(-2, -10); lc.lineTo(8, 6);
          lc.stroke();
          lc.beginPath();
          lc.moveTo(-2, -10); lc.lineTo(2, -2);
          lc.stroke();
        } else if (def.terrain === 'forest') {
          const s = def.sherwood ? (0.8 + rng() * 0.7) : 1;
          lc.scale(s, s);
          lc.beginPath(); lc.arc(0, -6, 5.5, 0, TAU); lc.fill();
          lc.beginPath(); lc.arc(-4, -2, 4.5, 0, TAU); lc.fill();
          lc.beginPath(); lc.arc(4, -2, 4.5, 0, TAU); lc.fill();
          lc.strokeStyle = 'rgba(70,46,24,0.8)';
          lc.beginPath(); lc.moveTo(0, 2); lc.lineTo(0, 9); lc.stroke();
        } else { // moor
          lc.beginPath();
          lc.moveTo(-9, 0); lc.lineTo(-3, 0);
          lc.moveTo(1, 4); lc.lineTo(8, 4);
          lc.stroke();
        }
        lc.restore();
        placed++;
      }
    }
  },

  terrAt(px, py) {
    const x = Math.floor(px / 2), y = Math.floor((py - MAPY) / 2);
    if (x < 0 || y < 0 || x >= HALFW || y >= HALFH) return -1;
    return this.idx[y * HALFW + x];
  },

  center(i) { return [this.cx[i] * 2, MAPY + this.cy[i] * 2]; },
};

/* ---------------- game state ---------------- */
function newGame(heroIdx, diff) {
  const hero = HEROES[heroIdx];
  const lords = [
    { id: 0, name: hero.name, color: PLAYER_COLOR, isPlayer: true, alive: true,
      gold: 80, fame: 10, joust: hero.joust, blade: hero.blade, lead: hero.lead,
      army: { s: 10, k: 2, c: 0 } },
  ];
  AI_LORDS.forEach((a, i) => lords.push({
    id: i + 1, name: a.name, color: a.color, isPlayer: false, alive: true,
    gold: 80, fame: 10, joust: a.joust, blade: a.blade, lead: a.lead,
    army: { s: 10, k: 2, c: 0 },
  }));
  const terr = TERR_DEFS.map((t, i) => ({
    id: i, name: t.name, owner: -1,
    garrison: t.sherwood ? 0 : irnd(6, 14), castle: 0,
    sherwood: !!t.sherwood,
    income: t.sherwood ? 0 : clamp(5 + Math.round(MapGen.area[i] / 1800), 5, 15),
  }));
  HOME_TERRS.forEach((ti, li) => {
    terr[ti].owner = li;
    terr[ti].garrison = 10;
    terr[ti].castle = 1;
    terr[ti].income += 4;
  });
  S = { month: 2, year: 1191, diff, lords, terr, actionUsed: false, sherwoodReadyAt: 0, log: [] };
  MapGen.repaint();
  saveGame();
}

function player() { return S.lords[0]; }
function lordTerrs(li) { return S.terr.filter(t => t.owner === li); }
function dateStr() { return `${MONTHS[S.month % 12]}, ${S.year} AD`; }
function armyStr(a, lead = 0) { return a.s + a.k * 4 + lead * 1.5; }
function armySize(a) { return a.s + a.k; }
function defStr(t, breach = 0) {
  return t.garrison * (1 + 0.3 * t.castle * (1 - breach));
}
function effLead(l) { return l.lead + l.fame / 25; }

/* territories lord `li` can march on (adjacent to any owned territory) */
function targetsFor(li) {
  const out = new Set();
  for (const t of S.terr) {
    if (t.owner !== li) continue;
    for (const a of MapGen.adj[t.id]) {
      // only land-bordering provinces, and never the outlaw greenwood
      if (S.terr[a].owner !== li && !S.terr[a].sherwood) out.add(a);
    }
  }
  return [...out];
}

/* ---------------- Sherwood Forest / Robin Hood ---------------- */
function monthAbs() { return S.year * 12 + S.month; }
function sherwoodCooldown() { return Math.max(0, (S.sherwoodReadyAt || 0) - monthAbs()); }
function playerBordersSherwood() {
  if (SHERWOOD < 0) return false;
  for (const a of MapGen.adj[SHERWOOD]) if (S.terr[a].owner === 0) return true;
  return false;
}
function richestRival() {
  let best = null;
  for (const l of S.lords) if (!l.isPlayer && l.alive && (!best || l.gold > best.gold)) best = l;
  return best;
}
/* score 0..30 from the archery contest -> Merry Men, loot and fame */
function grantRobinAid(score) {
  const p = player();
  const men = Math.round(3 + score / 3);              // longbowmen, counted as soldiers
  const knights = score >= 24 ? 2 : score >= 13 ? 1 : 0;
  p.army.s += men; p.army.k += knights;
  let gold = 0; const rival = richestRival();
  if (rival) { gold = Math.min(rival.gold, 15 + score); rival.gold -= gold; p.gold += gold; }
  p.fame += 4 + Math.round(score / 6);
  S.sherwoodReadyAt = monthAbs() + 3;
  saveGame();
  return { men, knights, gold, rival };
}

/* ---------------- battle resolution (shared with AI) ---------------- */
/* returns rounds for animation + outcome; mutates nothing */
function simBattle(att, attArmy, defT, breach, stance = 1) {
  // stance: 0 cautious, 1 steady, 2 bold
  const dealt = [0.85, 1, 1.25][stance];
  const taken = [0.75, 1, 1.15][stance];
  const a = { s: attArmy.s, k: attArmy.k };
  let dGar = defT.garrison;
  const dMul = 1 + 0.3 * defT.castle * (1 - breach);
  const leadBonus = 1 + effLead(att) * 0.045;
  const rounds = [];
  let guard = 0;
  while (armySize(a) > 0 && dGar > 0 && guard++ < 40) {
    const A = (a.s + a.k * 4) * leadBonus;
    const D = dGar * dMul;
    let dLoss = Math.max(1, Math.round(A * rnd(0.07, 0.13) * dealt / dMul));
    let aLoss = Math.max(1, Math.round(D * rnd(0.07, 0.13) * taken));
    dLoss = Math.min(dLoss, dGar);
    aLoss = Math.min(aLoss, armySize(a));
    dGar -= dLoss;
    // soldiers die first
    const sl = Math.min(a.s, aLoss);
    a.s -= sl;
    a.k -= Math.min(a.k, aLoss - sl);
    rounds.push({ aLoss, dLoss, as: a.s, ak: a.k, dg: dGar });
  }
  return { rounds, win: dGar <= 0 && armySize(a) > 0, as: a.s, ak: a.k, dg: Math.max(0, dGar) };
}

/* apply a finished battle to the world */
function applyBattle(attLord, defT, res) {
  attLord.army.s = res.as;
  attLord.army.k = res.ak;
  if (res.win) {
    captureTerr(defT.id, attLord.id, attLord);
  } else {
    defT.garrison = Math.max(1, res.dg);
  }
}

function captureTerr(ti, li, lord) {
  const t = S.terr[ti];
  const prevOwner = t.owner;
  t.owner = li;
  const g = Math.min(8, lord.army.s);
  lord.army.s -= g;
  t.garrison = Math.max(2, g);
  lord.fame += 4;
  MapGen.repaint();
  if (prevOwner >= 0) checkElimination(prevOwner);
}

function checkElimination(li) {
  const l = S.lords[li];
  if (l.alive && lordTerrs(li).length === 0) {
    l.alive = false;
    l.army = { s: 0, k: 0, c: 0 };
    toast(`The house of ${l.name} has fallen!`, '#ffb0a0');
    Sfx.dirge();
  }
}

function playerWon() { return S.terr.every(t => t.sherwood || t.owner === 0); }
function playerLost() { return !S.lords[0].alive || lordTerrs(0).length === 0; }

/* ---------------- AI ---------------- */
function aiTakeTurn(l) {
  if (!l.alive) return;
  const diff = DIFFS[S.diff];
  // shopping
  let budget = l.gold * 0.8;
  const myTargets = targetsFor(l.id).map(i => S.terr[i]);
  const wantCat = myTargets.some(t => t.castle > 0) && l.army.c < 2;
  if (wantCat && budget >= COSTS.catapult && Math.random() < 0.5) {
    l.gold -= COSTS.catapult; budget -= COSTS.catapult; l.army.c++;
  }
  while (budget >= COSTS.knight && Math.random() < 0.55) {
    l.gold -= COSTS.knight; budget -= COSTS.knight; l.army.k++;
  }
  while (budget >= COSTS.soldier) {
    l.gold -= COSTS.soldier; budget -= COSTS.soldier; l.army.s++;
  }
  // pick a fight
  if (myTargets.length === 0) return;
  myTargets.sort((a, b) => defStr(a) - defStr(b));
  const target = myTargets[0];
  const myStr = armyStr(l.army, effLead(l));
  const breach = (target.castle > 0 && l.army.c > 0) ? 0.45 : 0;
  if (myStr > defStr(target, breach) * diff.aiAggro && armySize(l.army) > 6) {
    const res = simBattle(l, l.army, target, breach);
    const vsPlayer = target.owner === 0;
    applyBattle(l, target, res);
    if (res.win) {
      toast(`${l.name} has seized ${target.name}!`, vsPlayer ? '#ffb0a0' : '#e8d8b0');
      if (vsPlayer) { buzz(120); Sfx.crack(); }
    } else if (vsPlayer) {
      toast(`Your garrison at ${target.name} repelled ${l.name}!`, '#b8e8a8');
      Sfx.fanfare();
    }
  }
}

/* ---------------- events ---------------- */
const EVENTS = [
  {
    title: 'Bountiful Harvest',
    text: () => 'Your fields overflow with grain. The granaries pay 35 gold into your coffers.',
    apply: () => { player().gold += 35; Sfx.coin(); },
  },
  {
    title: 'Bandits on the Roads',
    text: () => 'Outlaws plague your lands and waylay your tax wagons. You lose 25 gold.',
    apply: () => { player().gold = Math.max(0, player().gold - 25); },
  },
  {
    title: 'Wandering Knights',
    text: () => 'Word of your renown spreads. Two knights-errant pledge their lances to your banner!',
    apply: () => { player().army.k += 2; Sfx.fanfare(); },
  },
  {
    title: 'Fever in the Camp',
    text: () => 'A grim fever sweeps your encampment. Some of your soldiers will not rise again.',
    apply: () => { player().army.s = Math.max(0, player().army.s - irnd(2, 5)); },
  },
  {
    title: 'A Gift from the Greenwood',
    text: () => 'A hooded archer leaves a heavy purse at your camp by night — Robin Hood robs the rich to aid the just cause. You gain 30 gold.',
    apply: () => { player().gold += 30; Sfx.coin(); },
  },
  {
    title: 'A Royal Tribute',
    text: () => 'Travelling minstrels sing of your deeds in every hall. Your fame grows.',
    apply: () => { player().fame += 8; Sfx.fanfare(); },
  },
];

function rollEvent() {
  if (Math.random() < 0.28) return pick(EVENTS);
  return null;
}

/* ---------------- turn flow ---------------- */
function collectIncome() {
  const diff = DIFFS[S.diff];
  for (const l of S.lords) {
    if (!l.alive) continue;
    let inc = lordTerrs(l.id).reduce((s, t) => s + t.income, 0);
    if (!l.isPlayer) inc = Math.round(inc * diff.aiGold) + 4;
    l.gold += inc;
    if (l.isPlayer) l.lastIncome = inc;
  }
}

function advanceMonth() {
  S.month++;
  if (S.month >= 12) { S.month = 0; S.year++; }
}

/* ---------------- save / load ---------------- */
const SAVE_KEY = 'crownOfAlbion.save.v3';
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* private mode */ }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    S = JSON.parse(raw);
    MapGen.repaint();
    return true;
  } catch (e) { return false; }
}
function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
}

function roundRectPath(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* =========================================================
   high-quality character art
   figures are painted once at reference scale into an offscreen
   sprite (cached per colour) then blitted — detail + performance
   ========================================================= */
const STEEL_L = '#d6dce3', STEEL = '#9aa4af', _STEEL_D = '#586169';
const SKIN = '#d8b48c', SKIN_D = 'rgba(90,55,30,0.5)';
const _figCache = {};
function bakeFigure(key, box, paint) {
  if (_figCache[key]) return _figCache[key];
  const c = document.createElement('canvas');
  c.width = box.w; c.height = box.h;
  const prev = ctx;
  ctx = c.getContext('2d');
  ctx.translate(box.ox, box.oy);
  paint();
  ctx = prev;
  const spr = { c, ox: box.ox, oy: box.oy };
  _figCache[key] = spr;
  return spr;
}
function blitFigure(spr, x, y, scale, dir) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir, 1);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(spr.c, -spr.ox * scale, -spr.oy * scale, spr.c.width * scale, spr.c.height * scale);
  ctx.restore();
}

/* a shaded man-at-arms: mail, plate, surcoat, kite shield, spear, bascinet */
function paintManAtArms(color) {

  ctx.beginPath(); roundRectPath(-22, -8, 22, 10, 4); ctx.fill();

  ctx.fillStyle = 'rgba(228,236,245,0.4)';

  ctx.fillStyle = _STEEL_D;
  ctx.beginPath(); ctx.arc(0, -119, 11, Math.PI, 0); ctx.fill();
  for (const ox of [-17, 17]) {
    const pa = ctx.createRadialGradient(ox - 3, -118, 2, ox, -114, 12);

  ctx.beginPath(); ctx.moveTo(15, -110); ctx.lineTo(30, -84); ctx.stroke();
  ctx.strokeStyle = '#caa37a'; ctx.lineWidth = 7;

  ctx.beginPath(); ctx.moveTo(34, -150); ctx.lineTo(28, -4); ctx.stroke();
  ctx.fillStyle = STEEL_L;
  ctx.beginPath();

  // head + bascinet

/* archery butt for the Robin Hood contest */
function drawTarget(x, y, r) {
  ctx.save();
  ctx.strokeStyle = '#5a4226'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(x - r * 0.5, y + r); ctx.lineTo(x - r * 0.25, y + r * 1.8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + r * 0.5, y + r); ctx.lineTo(x + r * 0.25, y + r * 1.8); ctx.stroke();
  ctx.fillStyle = '#cdb87e';
  ctx.beginPath(); ctx.arc(x, y, r * 1.08, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#9c8650'; ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(x, y, r * 1.08 - i * 2.6, 0, TAU); ctx.stroke(); }
  const rings = [[1.0, '#efe6cf'], [0.92, '#2a2622'], [0.66, '#3a72b0'], [0.42, '#c8423a'], [0.18, '#f5c542']];
  for (const [rr, c] of rings) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r * rr, 0, TAU); ctx.fill(); }
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1.5;
  for (const [rr] of rings) { ctx.beginPath(); ctx.arc(x, y, r * rr, 0, TAU); ctx.stroke(); }
  ctx.restore();
}

/* ---------------- title ---------------- */
const TitleScene = {
  stars: [],
  enter() {
    this.stars = Array.from({ length: 90 }, () => ({ x: rnd(W), y: rnd(620), r: rnd(0.6, 2), p: rnd(TAU) }));
    this.buttons = [];
  },
  layoutButtons() {
    this.buttons = [];

    this.buttons.push(makeBtn(W / 2 - 180, y, 360, 78, 'New Saga', () => {
      setScene(SelectScene);
    }, { size: 30 }));
    y += 96;
    if (hasSave()) {
      this.buttons.push(makeBtn(W / 2 - 180, y, 360, 78, 'Continue', () => {
        if (loadGame()) setScene(MapScene);
        else toast('The chronicle could not be read.');
      }, { size: 30 }));

    }
    this.buttons.push(makeBtn(W / 2 - 180, y, 360, 60, Sfx.on ? 'Sound: On' : 'Sound: Off', () => {

    }, { size: 24, color: '#3a3a4a' }));
  },
  update() {
    if (Math.random() < 0.06) {
      spawn(rnd(W * 0.2, W * 0.8), rnd(700, 1100), {
        vx: rnd(-12, 12), vy: rnd(-26, -8), g: 0, life: rnd(1.5, 3),
        size: rnd(1.5, 3), color: 'rgba(255,220,130,0.9)', shrink: true,
      });
    }
  },
  render() {
    ctx.fillStyle = skyGradient(0, H, '#0b1026', '#2a2138');
    ctx.fillRect(0, 0, W, H);
    for (const s of this.stars) {
      ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(gTime * 0.8 + s.p));
      ctx.fillStyle = '#e8eeff';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
    // moon
    ctx.fillStyle = '#e8e4d2';

function softBlob(x, y, rx, ry, rot, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.scale(rx, ry);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill();
  ctx.restore();
}

function paintLordPortrait(cfg) {
  const PW = 280, PH = 372, cx = 140;
  const F = cfg.female;
  const skin = cfg.skin, skinHi = shade(skin, 0.2), skinSh = shade(skin, -0.3), skinDeep = shade(skin, -0.5);
  const browY = 162, eyeY = 180, noseBaseY = 210, mouthY = 236, chinY = F ? 266 : 272;
  const jw = F ? 0.86 : 1;
  const rng = mulberry32(cfg.seed);

  // backdrop with a soft halo behind the head
  const bg = ctx.createRadialGradient(cx, 150, 24, cx, 190, 270);
  bg.addColorStop(0, shade(cfg.garb, -0.18)); bg.addColorStop(0.6, '#1a1622'); bg.addColorStop(1, '#0b0a11');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, PW, PH);
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i < 130; i++) ctx.fillRect(rng() * PW, rng() * PH, 2, 2);
  softBlob(cx - 6, 150, 96, 116, 0, shade(cfg.garb, 0.12), 0.26);

  // shoulders / mantle
  const mg = ctx.createLinearGradient(0, 300, 0, PH);
  mg.addColorStop(0, shade(cfg.garb, 0.12)); mg.addColorStop(1, shade(cfg.garb, -0.45));
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.moveTo(-4, PH); ctx.lineTo(-4, 340);
  ctx.quadraticCurveTo(cx - 80, 300, cx - 28, 290);
  ctx.lineTo(cx + 28, 290);
  ctx.quadraticCurveTo(cx + 80, 300, PW + 4, 340);
  ctx.lineTo(PW + 4, PH); ctx.closePath(); ctx.fill();

  // long hair sits behind the head
  if (cfg.hairStyle === 'long') {
    ctx.fillStyle = shade(cfg.hair, -0.18);
    ctx.beginPath();
    ctx.moveTo(cx - 70, 120); ctx.quadraticCurveTo(cx - 104, 230, cx - 74, 320);
    ctx.lineTo(cx - 40, 318); ctx.quadraticCurveTo(cx - 60, 220, cx - 52, 140); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 70, 120); ctx.quadraticCurveTo(cx + 104, 230, cx + 74, 320);
    ctx.lineTo(cx + 40, 318); ctx.quadraticCurveTo(cx + 60, 220, cx + 52, 140); ctx.closePath(); ctx.fill();
  }

  // neck
  ctx.fillStyle = skinSh;
  ctx.beginPath(); roundRectPath(cx - 28, 206, 56, 96, 18); ctx.fill();
  softBlob(cx + 4, 250, 36, 30, 0, skinDeep, 0.5);

  // face
  const faceGrad = ctx.createRadialGradient(cx - 26, 150, 10, cx + 8, 196, 150);
  faceGrad.addColorStop(0, skinHi); faceGrad.addColorStop(0.5, skin); faceGrad.addColorStop(1, skinSh);
  ctx.fillStyle = faceGrad;
  ctx.beginPath();
  ctx.moveTo(cx - 76, 168);
  ctx.quadraticCurveTo(cx - 80, 108, cx - 44, 84);
  ctx.quadraticCurveTo(cx, 68, cx + 44, 84);
  ctx.quadraticCurveTo(cx + 80, 108, cx + 76, 168);
  ctx.quadraticCurveTo(cx + 72, 224, cx + 34 * jw, chinY - 12);
  ctx.quadraticCurveTo(cx, chinY, cx - 34 * jw, chinY - 12);
  ctx.quadraticCurveTo(cx - 72, 224, cx - 76, 168);
  ctx.closePath(); ctx.fill();

  // ears
  ctx.fillStyle = skin;
  for (const sx of [cx - 76, cx + 76]) { ctx.beginPath(); ctx.ellipse(sx, eyeY + 12, 9, 14, 0, 0, TAU); ctx.fill(); softBlob(sx, eyeY + 14, 5, 8, 0, skinDeep, 0.5); }

  // modelling: shadows and highlights
  softBlob(cx + 52, 156, 30, 60, 0, skinDeep, 0.3);     // shadowed cheek/temple (right)
  softBlob(cx - 36, 198, 26, 32, 0, skinHi, 0.45);       // lit cheek (left)
  softBlob(cx - 6, 122, 42, 22, 0, skinHi, 0.4);         // forehead light
  softBlob(cx + 18, 250, 40, 24, 0, skinDeep, 0.35);     // jaw shadow
  softBlob(cx, browY + 4, 50, 12, 0, skinSh, 0.3);       // brow ridge

  // eyebrows
  ctx.strokeStyle = cfg.brow; ctx.lineWidth = F ? 4 : 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - 42, browY + 2); ctx.quadraticCurveTo(cx - 27, browY - 7, cx - 12, browY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 42, browY + 2); ctx.quadraticCurveTo(cx + 27, browY - 7, cx + 12, browY); ctx.stroke();

  // eyes — almond shaped, heavy-lidded for a natural set
  for (const ex of [cx - 26, cx + 26]) {
    softBlob(ex, eyeY, 17, 11, 0, skinSh, 0.38);
    ctx.save();
    ctx.beginPath(); ctx.ellipse(ex, eyeY + 1, 12, 6.6, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = '#e9e1d4'; ctx.fillRect(ex - 13, eyeY - 7, 26, 16);
    softBlob(ex + 5, eyeY + 2, 8, 6, 0, 'rgba(120,100,80,0.5)', 0.5);
    const ig = ctx.createRadialGradient(ex - 1, eyeY, 1, ex, eyeY + 2, 6);
    ig.addColorStop(0, shade(cfg.eye, 0.5)); ig.addColorStop(0.7, cfg.eye); ig.addColorStop(1, shade(cfg.eye, -0.5));
    ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(ex, eyeY + 2, 5.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#130e0a'; ctx.beginPath(); ctx.arc(ex, eyeY + 2, 2.5, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(ex - 2, eyeY, 1.5, 0, TAU); ctx.fill();
    // heavy upper lid covers the top of the iris
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.moveTo(ex - 13, eyeY - 8); ctx.lineTo(ex + 13, eyeY - 8);
    ctx.quadraticCurveTo(ex, eyeY - 2.5, ex - 13, eyeY - 5); ctx.closePath(); ctx.fill();
    ctx.restore();
    // lash line + crease + lower lid
    ctx.strokeStyle = '#2a1c14'; ctx.lineWidth = F ? 2.4 : 2;
    ctx.beginPath(); ctx.moveTo(ex - 12, eyeY - 3); ctx.quadraticCurveTo(ex, eyeY - 7, ex + 12, eyeY - 3); ctx.stroke();
    ctx.strokeStyle = 'rgba(80,52,34,0.28)'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(ex - 11, eyeY - 8); ctx.quadraticCurveTo(ex, eyeY - 12, ex + 11, eyeY - 8); ctx.stroke();
    ctx.strokeStyle = 'rgba(60,40,28,0.22)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(ex - 10, eyeY + 7); ctx.quadraticCurveTo(ex, eyeY + 8.5, ex + 10, eyeY + 7); ctx.stroke();
  }

  // nose
  softBlob(cx - 2, 188, 7, 34, 0, skinHi, 0.4);
  softBlob(cx + 11, 198, 9, 28, 0, skinSh, 0.4);
  ctx.fillStyle = skinHi; ctx.beginPath(); ctx.arc(cx - 1, noseBaseY, 5, 0, TAU); ctx.fill();
  ctx.fillStyle = skinDeep;
  ctx.beginPath(); ctx.ellipse(cx - 7, noseBaseY + 3, 3, 2, 0.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 7, noseBaseY + 3, 3, 2, -0.3, 0, TAU); ctx.fill();

  // mouth — natural closed lips
  softBlob(cx, mouthY + 10, 24, 9, 0, skinSh, 0.3);
  const lipCol = mix(skin, '#b06a5e', F ? 0.55 : 0.42);
  const lw = F ? 16 : 14, lh = F ? 5 : 4;
  ctx.fillStyle = shade(lipCol, -0.14);              // upper lip
  ctx.beginPath();
  ctx.moveTo(cx - lw, mouthY);
  ctx.quadraticCurveTo(cx - 8, mouthY - lh, cx - 3, mouthY - 1);
  ctx.quadraticCurveTo(cx, mouthY - 2.5, cx + 3, mouthY - 1);
  ctx.quadraticCurveTo(cx + 8, mouthY - lh, cx + lw, mouthY);
  ctx.quadraticCurveTo(cx, mouthY + 1, cx - lw, mouthY); ctx.closePath(); ctx.fill();
  ctx.fillStyle = mix(lipCol, '#ffffff', 0.14);       // lower lip
  ctx.beginPath();
  ctx.moveTo(cx - lw + 2, mouthY + 1);
  ctx.quadraticCurveTo(cx, mouthY + lh + 4, cx + lw - 2, mouthY + 1);
  ctx.quadraticCurveTo(cx, mouthY + 2, cx - lw + 2, mouthY + 1); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(70,30,28,0.5)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(cx - lw + 1, mouthY); ctx.quadraticCurveTo(cx, mouthY + 1.5, cx + lw - 1, mouthY); ctx.stroke();
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(cx, mouthY + 4, lw * 0.42, 1.6, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  // philtrum highlight
  softBlob(cx, mouthY - 6, 4, 5, 0, skinHi, 0.4);

  // age lines
  if (cfg.age > 0.4) {
    ctx.strokeStyle = 'rgba(80,52,32,0.3)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(cx - 34, 118 + i * 9); ctx.quadraticCurveTo(cx, 112 + i * 9, cx + 34, 118 + i * 9); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(cx - 13, noseBaseY); ctx.quadraticCurveTo(cx - 22, mouthY, cx - 15, mouthY + 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 13, noseBaseY); ctx.quadraticCurveTo(cx + 22, mouthY, cx + 15, mouthY + 12); ctx.stroke();
    for (const sx of [cx - 46, cx + 46]) for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(sx, eyeY - 2 + i * 5); ctx.lineTo(sx + (sx < cx ? -9 : 9), eyeY - 6 + i * 6); ctx.stroke(); }
  }

  // beard
  if (cfg.beard === 'full') {
    const bc = cfg.beardCol, bs = shade(bc, -0.3), bh = shade(bc, 0.2);
    const bg2 = ctx.createLinearGradient(0, 190, 0, 300);
    bg2.addColorStop(0, bc); bg2.addColorStop(1, bs);
    ctx.fillStyle = bg2;
    ctx.beginPath();
    ctx.moveTo(cx - 60, 184);
    ctx.quadraticCurveTo(cx - 66, 244, cx - 28, 286);
    ctx.quadraticCurveTo(cx, 304, cx + 28, 286);
    ctx.quadraticCurveTo(cx + 66, 244, cx + 60, 184);
    ctx.quadraticCurveTo(cx + 40, 214, cx + 22, 208);
    ctx.quadraticCurveTo(cx, 218, cx - 22, 208);
    ctx.quadraticCurveTo(cx - 40, 214, cx - 60, 184);
    ctx.closePath(); ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - 60, 184); ctx.quadraticCurveTo(cx - 66, 244, cx - 28, 286);
    ctx.quadraticCurveTo(cx, 304, cx + 28, 286); ctx.quadraticCurveTo(cx + 66, 244, cx + 60, 184);
    ctx.quadraticCurveTo(cx + 40, 214, cx + 22, 208); ctx.quadraticCurveTo(cx, 218, cx - 22, 208);
    ctx.quadraticCurveTo(cx - 40, 214, cx - 60, 184); ctx.closePath(); ctx.clip();
    ctx.lineWidth = 1.3;
    for (let i = 0; i < 70; i++) {
      const sx = cx + (rng() - 0.5) * 120, sy = 196 + rng() * 90;
      ctx.strokeStyle = rng() < 0.5 ? bs : bh;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + (rng() - 0.5) * 4, sy + 8, sx + (cx - sx) * 0.04, sy + 16); ctx.stroke();
    }
    ctx.restore();
    // moustache over the lip
    ctx.fillStyle = bc;
    ctx.beginPath();
    ctx.moveTo(cx - 20, mouthY - 8); ctx.quadraticCurveTo(cx, mouthY - 3, cx + 20, mouthY - 8);
    ctx.quadraticCurveTo(cx + 10, mouthY + 2, cx, mouthY - 1); ctx.quadraticCurveTo(cx - 10, mouthY + 2, cx - 20, mouthY - 8);
    ctx.closePath(); ctx.fill();
  }

  // front hair / cap
  if (cfg.headgear === 'cap') {
    const cg = ctx.createLinearGradient(0, 70, 0, 150);
    cg.addColorStop(0, '#2c2636'); cg.addColorStop(1, '#171320');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(cx - 78, 150); ctx.quadraticCurveTo(cx - 84, 96, cx - 44, 78);
    ctx.quadraticCurveTo(cx, 60, cx + 44, 78); ctx.quadraticCurveTo(cx + 84, 96, cx + 78, 150);
    ctx.quadraticCurveTo(cx + 40, 120, cx, 124); ctx.quadraticCurveTo(cx - 40, 120, cx - 78, 150);
    ctx.closePath(); ctx.fill();
    softBlob(cx - 18, 96, 36, 16, 0, 'rgba(120,110,140,0.5)', 0.5);
  } else {
    const hg = ctx.createLinearGradient(0, 70, 0, 150);
    hg.addColorStop(0, cfg.hairHi); hg.addColorStop(1, shade(cfg.hair, -0.2));
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(cx - 80, 156); ctx.quadraticCurveTo(cx - 86, 92, cx - 44, 74);
    ctx.quadraticCurveTo(cx, 56, cx + 44, 74); ctx.quadraticCurveTo(cx + 86, 92, cx + 80, 156);
    ctx.quadraticCurveTo(cx + 60, 120, cx + 40, 116);
    ctx.quadraticCurveTo(cx + 30, 100, cx + (F ? 6 : 12), 112);   // fringe parting
    ctx.quadraticCurveTo(cx - 30, 100, cx - 44, 118);
    ctx.quadraticCurveTo(cx - 60, 122, cx - 80, 156);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = cfg.hairHi; ctx.lineWidth = 2; ctx.globalAlpha = 0.6;
    for (let i = 0; i < 8; i++) { const hx = cx - 60 + i * 16; ctx.beginPath(); ctx.moveTo(hx, 96 + (i % 2) * 6); ctx.quadraticCurveTo(hx + 6, 116, hx - 4, 138); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }

  // headgear: circlet
  if (cfg.headgear === 'gold' || cfg.headgear === 'silver') {
    const metalA = cfg.headgear === 'gold' ? '#ffe9a0' : '#e8eef2';
    const metalB = cfg.headgear === 'gold' ? '#9a6e1e' : '#7c8690';
    const bandG = ctx.createLinearGradient(0, 118, 0, 138);
    bandG.addColorStop(0, metalA); bandG.addColorStop(0.5, mix(metalA, metalB, 0.4)); bandG.addColorStop(1, metalB);
    ctx.fillStyle = bandG;
    ctx.beginPath();
    ctx.moveTo(cx - 70, 126); ctx.quadraticCurveTo(cx, 112, cx + 70, 126);
    ctx.quadraticCurveTo(cx, 122, cx - 70, 126); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = metalB; ctx.stroke();
    // centre gem
    const gem = cfg.headgear === 'gold' ? '#c33a4b' : '#2c6fb3';
    ctx.fillStyle = gem; ctx.beginPath(); ctx.arc(cx, 120, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(cx - 2, 118, 2, 0, TAU); ctx.fill();
    ctx.fillStyle = metalA; for (const gx of [cx - 30, cx + 30]) { ctx.beginPath(); ctx.arc(gx, 122, 3, 0, TAU); ctx.fill(); }
  }

  // chain of office
  if (cfg.chain) {
    ctx.fillStyle = '#e2b53e';
    for (let i = 0; i <= 12; i++) {
      const t = i / 12, lx = lerp(cx - 64, cx + 64, t), ly = 300 + Math.sin(t * Math.PI) * 26;
      ctx.beginPath(); ctx.arc(lx, ly, 4, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#c9a44a'; ctx.beginPath(); ctx.arc(cx, 332, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7a2a3a'; ctx.beginPath(); ctx.arc(cx, 332, 4, 0, TAU); ctx.fill();
  }

  // overall light glaze + frame vignette
  softBlob(cx - 40, 110, 120, 120, 0, 'rgba(255,240,210,0.10)', 1);
  const vg = ctx.createRadialGradient(cx, 190, 120, cx, 200, 240);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(8,6,12,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, PW, PH);
}

const _portCache = {};
function bakePortrait(i) {
  if (_portCache[i]) return _portCache[i];
  const c = document.createElement('canvas'); c.width = 280; c.height = 372;
  const prev = ctx; ctx = c.getContext('2d');
  paintLordPortrait(LORD_LOOK[i]);
  ctx = prev;
  _portCache[i] = c;
  return c;
}

/* ---------------- hero select ---------------- */
const SelectScene = {
  enter() { this.cards = []; },
  render() {
    ctx.fillStyle = skyGradient(0, H, '#1c1626', '#0e0c16');
    ctx.fillRect(0, 0, W, H);
    textShadow('Choose Your Champion', W / 2, 90, 44, '#ffd75e');
    text('Each hero excels at a different path to the crown.', W / 2, 145, 24, '#cbbf9f');
    this.cards = [];
    HEROES.forEach((h, i) => {
      const x = 50, y = 200 + i * 300, w = W - 100, hh = 270;
      this.cards.push({ x, y, w, h: hh, i });
      panel(x, y, w, hh);
      // painted portrait of the lord, in a gold frame
      const pr = bakePortrait(i);
      const px = x + 16, pw = 156, ph = 206, py = y + 32;
      ctx.save();
      roundRect(px, py, pw, ph, 12); ctx.clip();
      ctx.drawImage(pr, px, py, pw, ph);
      ctx.restore();
      ctx.strokeStyle = '#c9a44a'; ctx.lineWidth = 4; roundRect(px, py, pw, ph, 12); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,235,180,0.3)'; ctx.lineWidth = 1.5; roundRect(px + 4, py + 4, pw - 8, ph - 8, 9); ctx.stroke();
      textShadow(h.name, x + 188, y + 52, 28, '#f5e9c8', 'left');
      const lines = wrapLines(h.blurb, 20, w - 230);
      lines.forEach((ln, li) => text(ln, x + 188, y + 90 + li * 25, 20, '#cbbf9f', 'left'));
      // stat bars
      const stats = [['Joust', h.joust], ['Blade', h.blade], ['Leadership', h.lead]];
      stats.forEach(([nm, v], si) => {
        const sy = y + 158 + si * 32;
        text(nm, x + 188, sy, 20, '#e8d8b0', 'left');
        ctx.fillStyle = '#1c1410';
        roundRect(x + 320, sy - 9, 238, 18, 8); ctx.fill();
        ctx.fillStyle = mix('#7a3030', '#e2b53e', v / 10);
        roundRect(x + 320, sy - 9, 238 * v / 10, 18, 8); ctx.fill();
        text(String(v), x + 582, sy, 20, '#ffd75e', 'left');
      });
      text('Tap to choose', x + w / 2, y + hh - 18, 18, 'rgba(220,205,170,0.55)');
    });
  },
  onTap(x, y) {
    for (const c of this.cards) {
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        Sfx.fanfare();
        this.pickDifficulty(c.i);
        return;
      }
    }
  },
  pickDifficulty(heroIdx) {
    Modal.show({
      title: 'How hard shall the road be?',
      lines: 'Choose the cunning and wealth of your rival lords.',
      buttons: DIFFS.map((d, i) => ({
        label: d.name,
        fn: () => {
          newGame(heroIdx, i);
          setScene(MapScene);
          Modal.show({
            title: 'The King is Dead!',
            lines: [
              'Albion has no ruler, and twelve provinces lie in dispute. Three rival lords muster their banners.',
              'Raise armies, win tournaments, lay siege to castles — and claim the crown for yourself.',
            ],
            buttons: [{ label: 'To Glory!', fn: () => Sfx.fanfare() }],
          });
        },
      })),
    });
  },
};
